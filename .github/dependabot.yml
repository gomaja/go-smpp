version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
      include: scope
    groups:
      go-modules:
        patterns:
          - '*'
