version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
      include: scope
    groups:
      go-modules:
        patterns:
          - '*'
        exclude-patterns:
          - golang.org/x/text
    ignore:
      - dependency-name: golang.org/x/text
        versions:
          - '>=0.35.0'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:30'
      timezone: Europe/Paris
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
      include: scope
    groups:
      actions:
        patterns:
          - '*'
