# golangci-lint configuration.
#
# The previous file listed every linter under both `enable` and `disable`, so
# the two lists cancelled out and the only linters that ran were ones added to
# golangci-lint after the lists were written (exhaustruct_v5, godoclint,
# iotamixing, ...). The lint job therefore gated on almost nothing, and each
# golangci-lint upgrade switched on whatever happened to be new.
#
# The standard set is used instead, with the issue caps off so the number
# printed is the number that exists.

version: "2"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: standard
  settings:
    staticcheck:
      # golangci-lint's default check list, plus one deliberate subtraction.
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # QF1008 ("could remove embedded field from selector") is an editor
        # quick fix, not a correctness or style class; the staticcheck binary
        # does not ship QF checks at all. In the pdu package every codec calls
        # c.base.marshal / c.base.unmarshal explicitly, which says the call
        # belongs to the shared header/TLV framing rather than to the PDU body.
        # Dropping the embedded name would also change which method a selector
        # resolves to if a PDU type ever grew its own marshal method — a silent
        # behaviour change in wire-format code.
        - -QF1008
